<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>EV Wallet QR Scanner</title>
  <style>
    body { font-family: sans-serif; text-align: center; }
    video { width: 100%; max-width: 500px; border: 2px solid #333; }
  </style>
</head>
<body>
  <h1>Scan QR Code</h1>
  <video id="preview" autoplay></video>

  <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
  <script>
    function onScanSuccess(decodedText) {
      alert("QR Code: " + decodedText);
      window.location.href = decodedText; // redirect if it's a URL
    }

    const html5QrCode = new Html5Qrcode("preview");
    html5QrCode.start(
      { facingMode: "environment" },
      { fps: 10, qrbox: 250 },
      onScanSuccess
    ).catch(err => console.error("Unable to start scanner", err));
  </script>
</body>
</html>
