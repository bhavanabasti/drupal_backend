user_api.log_device_event:
  path: '/api/device_event_log'
  defaults:
    _controller: '\Drupal\user_api\Controller\UserApiController::deviceEventLog'
    _title: 'Log device event'
  methods: [POST]
  requirements:
    _permission: 'access content'

user_api.login:
  path: '/api/login'
  defaults:
    _controller: '\Drupal\user_api\Controller\UserApiController::login'
    _title: 'Login'
  methods: [POST]
  requirements:
    _access: 'TRUE'

user_api.current_user:
  path: '/api/current-user'
  defaults:
    _controller: '\Drupal\user_api\Controller\UserApiController::currentUser'
    _title: 'Current User'
  methods: [GET]
  requirements:
    _access: 'TRUE'


user_api.session_status:
  path: '/api/session-status'
  defaults:
    _controller: '\Drupal\user_api\Controller\SessionStatusController::check'
    _title: 'Session Status'
  requirements:
    _access: 'TRUE'


    
